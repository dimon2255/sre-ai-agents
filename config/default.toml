# SRE AI Agents Platform Configuration

[azure]
# Auth mode: "azure" (DefaultAzureCredential) or "mock" (dev token)
auth_mode = "mock"
# subscription_id = ""
# Log Analytics workspace IDs
# workspace_ids = []
# App Insights application IDs
# app_insights_ids = []

[orchestrator]
agent_timeout_secs = 30
max_concurrent_investigations = 10
max_parallel_agents_per_investigation = 5

[agents.triage]
enabled = true

[agents.logs]
enabled = true
default_timespan_minutes = 30
max_rows = 1000

[agents.metrics]
enabled = true
default_timespan_minutes = 30

[agents.trace]
enabled = true
default_timespan_minutes = 30
max_rows = 50

[agents.infra]
enabled = true
default_timespan_minutes = 120
max_rows = 50

[webhook]
listen_addr = "0.0.0.0"
listen_port = 8080
# HMAC-SHA256 shared secret for webhook auth (ADR-008).
# When unset, the /api/v1/alerts/azure endpoint runs unauthenticated (dev only).
# Staging/production MUST override via SRE__WEBHOOK__HMAC_SECRET.
# hmac_secret = ""
# hmac_skew_seconds = 300

[store]
# Local dev default assumes Postgres running at localhost:5432 with user=postgres / password=password.
# Override via SRE__STORE__DATABASE_URL in staging/prod.
database_url = "postgres://postgres:password@localhost:5432/sre_agents"

# [observability]
# enabled = false
# otlp_endpoint = "http://localhost:4317"   # gRPC OTLP (ACA env-managed agent listens here, NOT 4318)
# service_name = "sre-agents-platform"
# environment = "staging"

# NATS JetStream ingestion (ADR-013).
# When disabled, the platform behaves exactly as before — only the webhook receives alerts.
# In staging/prod, set credentials_path to a NATS NKEY/JWT credentials file.
# [nats]
# enabled = false
# url = "nats://localhost:4222"
# credentials_path = "/secrets/nats.creds"
# stream_name = "sre-alerts"
# consumer_name = "sre-orchestrator"
# subject_filter = "alerts.azure.>"
# max_ack_pending = 64
# ack_wait_secs = 60
# max_deliver = 5
# max_age_hours = 24
# num_replicas = 1
# Dead-letter queue (ADR-013 PR-3): poison (unparseable) messages are
# republished to the DLQ stream before being terminated, for forensic inspection.
# dlq_enabled = true
# dlq_stream_name = "sre-alerts-dlq"
# dlq_subject_filter = "alerts.dlq.azure.>"
# dlq_subject = "alerts.dlq.azure.poison"
# dlq_max_age_hours = 168

# Notification engine (Phase 2b). Delivers investigation reports + escalations
# to Slack / Teams / PagerDuty. Disabled by default. When enabled with no
# provider configured, a logging mock notifier is used (dev). Provider secrets
# should be supplied via env, e.g. SRE__NOTIFICATIONS__SLACK__WEBHOOK_URL.
# [notifications]
# enabled = false
# min_severity = "high"          # critical | high | medium | low | info
# notify_on_escalation = true
# [notifications.slack]
# webhook_url = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
# [notifications.teams]
# webhook_url = "https://outlook.office.com/webhook/XXX"
# [notifications.pagerduty]
# routing_key = "R0UT1NGK3Y"

# gRPC API (Phase 2b). External systems can trigger and query investigations.
# Disabled by default; runs on its own port (separate from the webhook).
# [grpc]
# enabled = false
# listen_addr = "0.0.0.0"
# listen_port = 50051

# Gated remediation pipeline (Phase 2c, ADR-009). Disabled by default — the
# platform proposes + executes remediations only when explicitly enabled. With
# auth_mode=mock, ARM writes go to a mock client (no real Azure mutation).
# IMPORTANT (ADR-011): do NOT enable in staging/prod until the separate
# remediation managed identity is provisioned — until then the write path
# reuses the read identity, which violates ADR-011.
# [remediation]
# enabled = false
# subscription_id = ""               # falls back to azure.subscription_id
# kill_switch = false
# per_subscription_hourly_limit = 5
# per_resource_type_hourly_limit = 3
# auto_approve_min_confidence = 0.95
# business_hours_only = false
# progressive_trust = false          # Phase 3 (ADR-017): trusted categories earn a
#                                    # lower auto-approve floor (0.95→0.85) over
#                                    # consecutive successes; a failure resets +
#                                    # cools down. Never bypasses the gate.

# LLM reasoning engine (Phase 3, ADR-015). Synthesizes a root-cause analysis
# after each investigation, enriching the report summary. Disabled by default.
# When enabled with provider="claude", set ANTHROPIC_API_KEY (otherwise it
# falls back to the deterministic mock engine). Defaults to claude-opus-4-8.
# [reasoning]
# enabled = false
# provider = "claude"               # claude | mock
# model = "claude-opus-4-8"
# max_tokens = 2048
# api_key_env = "ANTHROPIC_API_KEY"

# Knowledge store + learning loop (Phase 3, ADR-016). A vector memory of past
# incidents: grounds the reasoning engine with similar prior incidents (RAG) and
# embeds each completed incident for future retrieval. Disabled by default. When
# enabled it defaults to a deterministic in-memory mock (offline RAG, no
# dependencies); set provider="qdrant" + url for the real vector DB (api_key_env
# holds the Qdrant Cloud key, omit for a local Qdrant).
# [knowledge]
# enabled = false
# provider = "mock"                 # mock | qdrant
# url = "http://localhost:6333"
# collection = "sre_incidents"
# vector_dim = 256
# top_k = 3
# api_key_env = "QDRANT_API_KEY"

# ChatOps conversational interface (Phase 3, ADR-018). Disabled by default. When
# enabled, exposes POST /api/v1/chatops for Slack slash commands so operators can
# trigger investigations ("investigate <resource> [severity]") and query status
# ("status <id>") from chat. Slack request-signature verification is a forward
# step; until then the endpoint relies on ingress isolation (do not expose it
# publicly without the signing check).
# [chatops]
# enabled = false
# signing_secret_env = "SLACK_SIGNING_SECRET"
