# SRE AI Agents Platform Configuration

[azure]
# Auth mode: "azure" (DefaultAzureCredential) or "mock" (dev token)
auth_mode = "mock"
# subscription_id = ""
# Log Analytics workspace IDs
# workspace_ids = []
# App Insights application IDs
# app_insights_ids = []

[orchestrator]
agent_timeout_secs = 30
max_concurrent_investigations = 10
max_parallel_agents_per_investigation = 5

[agents.triage]
enabled = true

[agents.logs]
enabled = true
default_timespan_minutes = 30
max_rows = 1000

[agents.metrics]
enabled = true
default_timespan_minutes = 30

[agents.trace]
enabled = true
default_timespan_minutes = 30
max_rows = 50

[agents.infra]
enabled = true
default_timespan_minutes = 120
max_rows = 50

[webhook]
listen_addr = "0.0.0.0"
listen_port = 8080
# HMAC-SHA256 shared secret for webhook auth (ADR-008).
# When unset, the /api/v1/alerts/azure endpoint runs unauthenticated (dev only).
# Staging/production MUST override via SRE__WEBHOOK__HMAC_SECRET.
# hmac_secret = ""
# hmac_skew_seconds = 300

[store]
# Local dev default assumes Postgres running at localhost:5432 with user=postgres / password=password.
# Override via SRE__STORE__DATABASE_URL in staging/prod.
database_url = "postgres://postgres:password@localhost:5432/sre_agents"

# [observability]
# enabled = false
# otlp_endpoint = "http://localhost:4317"   # gRPC OTLP (ACA env-managed agent listens here, NOT 4318)
# service_name = "sre-agents-platform"
# environment = "staging"

# NATS JetStream ingestion (ADR-013).
# When disabled, the platform behaves exactly as before — only the webhook receives alerts.
# In staging/prod, set credentials_path to a NATS NKEY/JWT credentials file.
# [nats]
# enabled = false
# url = "nats://localhost:4222"
# credentials_path = "/secrets/nats.creds"
# stream_name = "sre-alerts"
# consumer_name = "sre-orchestrator"
# subject_filter = "alerts.azure.>"
# max_ack_pending = 64
# ack_wait_secs = 60
# max_deliver = 5
# max_age_hours = 24
# num_replicas = 1
