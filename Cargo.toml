[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/store",
    "crates/azure",
    "crates/agent-sdk",
    "crates/agents",
    "crates/orchestrator",
    "crates/notify",
    "crates/gates",
    "crates/intelligence",
    "crates/chatops",
    "crates/evals",
    ".",
]

[package]
name = "sre-agents-platform"
version.workspace = true
edition.workspace = true

[lib]
name = "sre_agents_platform"
path = "src/lib.rs"

[[bin]]
name = "sre-agents"
path = "src/main.rs"

[dependencies]
sre-common = { path = "crates/common" }
sre-store = { path = "crates/store" }
sre-azure = { path = "crates/azure" }
sre-agents = { path = "crates/agents" }
sre-orchestrator = { path = "crates/orchestrator" }
sre-notify = { path = "crates/notify" }
sre-gates = { path = "crates/gates" }
sre-intelligence = { path = "crates/intelligence" }
sre-chatops = { path = "crates/chatops" }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
clap.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
config.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
hex.workspace = true
async-nats.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde_json.workspace = true
sqlx = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres", "nats"] }
futures-util.workspace = true
bytes = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/dimon2255/sre-ai-agents"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
# reqwest 0.13 defaults to rustls with the aws-lc-rs provider, a native build that
# needs a C compiler and, on Windows x86-64, NASM. sqlx and tokio-rustls in this tree
# already enable ring, so reqwest is built without a provider and
# `sre_common::http::client_builder` installs ring as the process default before any
# client is built. The list below is 0.13's default set minus `default-tls`, plus
# `query` (a separate feature since 0.13) and `json`.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Azure
azure_identity = "0.22"
azure_core = "0.22"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }

# URL parsing
url = "2"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Config
config = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# Web server (webhook endpoint)
axum = "0.8"

# Webhook HMAC authentication (ADR-008)
hmac = "0.13"
sha2 = "0.11"
subtle = "2.5"
hex = "0.4"

# NATS JetStream client (ADR-013)
async-nats = "0.50"

# Cancellation tokens for graceful shutdown
tokio-util = { version = "0.7", features = ["rt"] }

# Streams (used with async-nats consumer.messages())
futures-util = "0.3"

# gRPC API (Phase 2b)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"

# Testing
wiremock = "0.6"
tokio-test = "0.4"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
