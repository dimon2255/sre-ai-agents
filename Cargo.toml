[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/store",
    "crates/azure",
    "crates/agents",
    "crates/orchestrator",
    ".",
]

[package]
name = "sre-agents-platform"
version.workspace = true
edition.workspace = true

[lib]
name = "sre_agents_platform"
path = "src/lib.rs"

[[bin]]
name = "sre-agents"
path = "src/main.rs"

[dependencies]
sre-common = { path = "crates/common" }
sre-store = { path = "crates/store" }
sre-azure = { path = "crates/azure" }
sre-agents = { path = "crates/agents" }
sre-orchestrator = { path = "crates/orchestrator" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
clap.workspace = true
axum.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
config.workspace = true

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
serde_json.workspace = true
sqlx = { workspace = true }
testcontainers-modules.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/dimon2255/sre-ai-agents"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Azure
azure_identity = "0.22"
azure_core = "0.22"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }

# URL parsing
url = "2"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Config
config = "0.14"

# CLI
clap = { version = "4", features = ["derive"] }

# Web server (webhook endpoint)
axum = "0.8"

# Testing
wiremock = "0.6"
tokio-test = "0.4"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
