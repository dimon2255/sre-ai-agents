# Keeps Cargo crates, GitHub Actions and the Docker base image current.
# The workflows pin actions to tags or branches (e.g. actions/checkout@v7,
# dtolnay/rust-toolchain@stable), not commit SHAs; SHA pinning is an open
# hardening item in docs/PROGRESS.md.
#
# Everything is grouped. Ungrouped, each bump arrived as its own PR against a
# shared Cargo.lock, so they could not be merged in any order without rebasing
# the rest, and each carried Dependabot's own partial lockfile resolution --
# which twice regressed a transitive dep (PR #55 downgraded windows-sys
# 0.61.2 -> 0.52.0, PR #59 downgraded getrandom 0.4.3 -> 0.3.4). Six such PRs
# accumulated and had to be closed in favour of one hand-consolidated PR (#60).
# Grouping makes Dependabot do that consolidation itself: one PR, one lockfile
# resolution, one CI run per week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bounds the blast radius if a group ever fails to resolve and Dependabot
    # falls back to individual PRs.
    open-pull-requests-limit: 5
    groups:
      # The OpenTelemetry crates share internal types, so a bump of one without
      # the others fails to compile (four separate 0.32 -> 0.33 PRs did exactly
      # that on 2026-10-12). They move together, whatever the bump size.
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
      # Minor and patch bumps are the routine case and are safe to batch: they
      # are semver-compatible, so the group resolves as one lockfile update.
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      # Major bumps stay in their own PR. They break APIs (async-nats 0.48->0.50
      # needed a manifest edit; reqwest 0.13 needs the three workspace crates
      # that still pin 0.12 to move together) and need per-crate review, which
      # a batched PR would hide.

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
