# Keeps dependencies — including SHA-pinned GitHub Actions — current.
# Pinning actions to a commit SHA (supply-chain hardening) is only safe if a
# bot keeps the pins fresh; that is Dependabot's job here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
